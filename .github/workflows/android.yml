name: Android APK

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      team_signed:
        description: Build with the fixed team signing key (requires repository secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true
      - name: Lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace
      - name: Build demo APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.team_signed }}
        run: ./gradlew assembleDebug --stacktrace
      - name: Build team-signed APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.team_signed }}
        env:
          TEAM_KEYSTORE_BASE64: ${{ secrets.TEAM_KEYSTORE_BASE64 }}
          TEAM_STORE_PASSWORD: ${{ secrets.TEAM_STORE_PASSWORD }}
          TEAM_KEY_ALIAS: ${{ secrets.TEAM_KEY_ALIAS }}
          TEAM_KEY_PASSWORD: ${{ secrets.TEAM_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TEAM_KEYSTORE_BASE64:?Missing TEAM_KEYSTORE_BASE64 secret}"
          : "${TEAM_STORE_PASSWORD:?Missing TEAM_STORE_PASSWORD secret}"
          : "${TEAM_KEY_ALIAS:?Missing TEAM_KEY_ALIAS secret}"
          : "${TEAM_KEY_PASSWORD:?Missing TEAM_KEY_PASSWORD secret}"
          export TEAM_KEYSTORE_PATH="$RUNNER_TEMP/ars-agent-team.jks"
          trap 'rm -f "$TEAM_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$TEAM_KEYSTORE_BASE64" | base64 --decode > "$TEAM_KEYSTORE_PATH"
          ./gradlew assembleDebug --stacktrace --no-configuration-cache
      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ars-agent-demo-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
