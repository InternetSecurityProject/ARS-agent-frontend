name: Android APK

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_DISTRIBUTE: ${{ github.ref == 'refs/heads/feat/compose-mvp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true
      - name: Lint and unit tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew lintDebug testDebugUnitTest --stacktrace
      - name: Set increasing APK version
        shell: bash
        run: echo "APP_VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Build demo APK
        if: env.FIREBASE_DISTRIBUTE != 'true'
        run: ./gradlew assembleDebug -PappVersionCode="$APP_VERSION_CODE" --stacktrace
      - name: Validate Firebase Android client configuration
        if: env.FIREBASE_DISTRIBUTE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: python3 scripts/firebase_config.py --output app/src/debug/assets/firebase/firebase-team.json
      - name: Build fixed team-signed Firebase APK
        if: env.FIREBASE_DISTRIBUTE == 'true'
        env:
          TEAM_KEYSTORE_BASE64: ${{ secrets.TEAM_KEYSTORE_BASE64 }}
          TEAM_STORE_PASSWORD: ${{ secrets.TEAM_STORE_PASSWORD }}
          TEAM_KEY_ALIAS: ${{ secrets.TEAM_KEY_ALIAS }}
          TEAM_KEY_PASSWORD: ${{ secrets.TEAM_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TEAM_KEYSTORE_BASE64:?Missing TEAM_KEYSTORE_BASE64 secret}"
          : "${TEAM_STORE_PASSWORD:?Missing TEAM_STORE_PASSWORD secret}"
          : "${TEAM_KEY_ALIAS:?Missing TEAM_KEY_ALIAS secret}"
          : "${TEAM_KEY_PASSWORD:?Missing TEAM_KEY_PASSWORD secret}"
          export TEAM_KEYSTORE_PATH="$RUNNER_TEMP/ars-agent-team.jks"
          trap 'rm -f "$TEAM_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$TEAM_KEYSTORE_BASE64" | base64 --decode > "$TEAM_KEYSTORE_PATH"
          ./gradlew assembleDebug -PappVersionCode="$APP_VERSION_CODE" --stacktrace --no-configuration-cache
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ars-agent-demo-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.FIREBASE_DISTRIBUTE == 'true'
        with:
          node-version: '22'
      - name: Install pinned Firebase CLI
        if: env.FIREBASE_DISTRIBUTE == 'true'
        run: npm install --prefix "$RUNNER_TEMP/firebase-cli" --ignore-scripts --no-audit --no-fund firebase-tools@15.34.1
      - name: Distribute to Firebase meokbodeul
        if: env.FIREBASE_DISTRIBUTE == 'true'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ars-firebase-service.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS" "$RUNNER_TEMP/ars-firebase-public.json"' EXIT
          python3 scripts/firebase_config.py --output "$RUNNER_TEMP/ars-firebase-public.json" --credentials-out "$GOOGLE_APPLICATION_CREDENTIALS"
          # CLI never needs the original JSON environment variables after ADC is written.
          unset FIREBASE_SERVICE_ACCOUNT_JSON GOOGLE_SERVICES_JSON
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" appdistribution:distribute \
            "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" \
            --app "$FIREBASE_APP_ID" --groups meokbodeul \
            --release-notes "feat/compose-mvp · $GITHUB_SHA · APK $APP_VERSION_CODE" --non-interactive
      - name: Remove temporary signing and Firebase inputs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ars-agent-team.jks" "$RUNNER_TEMP/ars-firebase-service.json" "$RUNNER_TEMP/ars-firebase-public.json"
          rm -f app/src/debug/assets/firebase/firebase-team.json
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
